[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "planeon-harness-sdk"
version = "0.1.0"
description = "Generated transport-neutral clients for Planeon MAS harness contracts"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["cryptography==49.0.0"]

[project.optional-dependencies]
crewai = ["crewai>=1.15,<2"]
langchain = ["langchain-core>=1.6,<2"]
langgraph = ["langgraph>=1.2,<2"]
mcp = ["mcp>=2.1,<3"]
semantic-kernel = ["semantic-kernel>=1.44,<2"]

[tool.planeon]
contract-lock = "../contracts.lock.json"
network-default = "disabled"
